<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automotive Project || Contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img src="assets/piston.png" alt="Logo" class="logo-icon me-2" />

          <span class="fw-bold">My Automotive Project</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="fundamentals.html"> Fundamentals </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="case-study.html"> Case Study </a>
            </li>

            <li class="nav-item">
              <a class="nav-link active-nav" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Contact form -->
    <div class="container col-xxl-8 px-4 py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <!-- Heading -->

          <div class="text-center mb-5">
            <p class="text-uppercase text-secondary fw-semibold">Contact</p>

            <h1 class="display-5 fw-bold text-2 mb-3">Get In Touch</h1>

            <p class="lead p-text">
              Feel free to reach out regarding automotive discussions, feedback,
              or even if you just want to connect!
            </p>
          </div>

          <!-- Form -->

          <form id="contactForm" class="contact-form">
            <!-- Name -->

            <div class="mb-4">
              <label class="form-label p-text"> Full Name </label>

              <input
                type="text"
                class="form-control custom-input"
                placeholder="Enter your name"
                required
              />
            </div>

            <!-- Email -->

            <div class="mb-4">
              <label class="form-label p-text"> Email Address </label>

              <input
                type="email"
                class="form-control custom-input"
                placeholder="Enter your email"
                required
              />
            </div>

            <!-- Message -->

            <div class="mb-4">
              <label class="form-label p-text"> Message </label>

              <textarea
                class="form-control custom-input"
                rows="6"
                placeholder="Write your message here..."
                required
              ></textarea>
            </div>

            <!-- Button -->

            <div class="text-center">
              <button type="submit" class="btn btn-1 px-5 py-2">
                <div class="nav-link">Send Message</div>
              </button>
            </div>
          </form>

          <!-- Success Message -->

          <p id="successMessage" class="p-text text-center mt-4 d-none">
            Message sent successfully.
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
